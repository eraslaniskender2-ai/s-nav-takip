name: APK olustur
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dosyalari yerlestir
        run: |
          mkdir -p www assets scripts android-signing
          cp index.html icon-192.png icon-512.png icon-maskable-512.png www/
          cp icon-only.png icon-foreground.png icon-background.png assets/
          cp patch-android.js scripts/
          cp debug.keystore android-signing/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Paketleri kur
        run: npm install
      - name: PDF kutuphanesini ekle
        run: |
          mkdir -p www
          cp node_modules/pdfjs-dist/build/pdf.min.js www/pdf.min.js || cp node_modules/pdfjs-dist/build/pdf.js www/pdf.min.js
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/pdf.worker.min.js || cp node_modules/pdfjs-dist/build/pdf.worker.js www/pdf.worker.min.js
      - name: Android projesini olustur
        run: npx cap add android
      - name: Simgeleri uret
        run: npx capacitor-assets generate --android
      - name: Izinleri ekle
        run: node scripts/patch-android.js
      - name: Dosyalari esitle
        run: npx cap sync android
      - name: Sabit imza anahtarini yerlestir
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore
      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: APK adini duzenle
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sinav-Takip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sinav-Takip-APK
          path: Sinav-Takip.apk
