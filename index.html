const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sdv=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
function slope(a){const n=a.length,mx=(n-1)/2,my=mean(a);let nu=0,de=0;a.forEach((y,i)=>{nu+=(i-mx)*(y-my);de+=(i-mx)**2});return de?nu/de:0}
function trendOf(a,thr){const m=a.length;if(m<2)return{k:'yok',m};const sl=m===2?a[1]-a[0]:slope(a.slice(-5));return{k:sl>=thr?'up':sl<=-thr?'down':'flat',m,sl}}
function coachSub(n,c){const ex=sorted().filter(e=>e.res[n]);if(!ex.length)return null;
const sr=ex.map(e=>eNet(e,n)),k=Math.min(3,sr.length),av=mean(sr.slice(-k)),t=+S.targets[n]||0,L=ex.slice(-k).map(e=>e.res[n]);
const dA=mean(L.map(r=>r.d)),yA=mean(L.map(r=>r.y)),bA=Math.max(0,c-dA-yA),bR=bA/c,tr=trendOf(sr,Math.max(.5,.02*c)),ft=freq().filter(x=>x.d===n&&x.c>=2),seq=sr.slice(-4).map(r1).join(' → ');
const R=[];let sc=0;
if(t>0){const g=t-av;if(g>.25){R.push(`Hedefe ${r1(g)} net uzaktasın (son ${k} deneme ortalaması ${r1(av)}, hedef ${t}).`);sc+=g}else R.push(`Hedefe ulaşmış görünüyorsun (ortalama ${r1(av)}, hedef ${t}).`)}

const MAIL='eraslaniskender2@gmail.com',VER='0.9.5';
let fb={t:'Öneri'};
function fbSync(){const m=$('#fm'),e=$('#fe'),d=$('#fd');if(m&&m.value!==undefined)fb.msg=m.value;if(e&&e.value!==undefined)fb.em=e.value;if(d&&d.checked!==undefined)fb.dev=d.checked}
function fbOpen(){const u=S.user||{},em=fb.em!==undefined?fb.em:(u.email||'');
modal(`<h1>Geri bildirim</h1><p class="mu" style="margin:6px 0 4px">Şikayetin 3 saat içinde ilgilenilecek, gerekirse sana geri dönüş yapılacak.</p>
<label>Tür</label><div>${['Şikayet','Öneri','Hata bildirimi','Diğer'].map(t=>`<button class="chip" style="border:0;cursor:pointer;font:inherit;font-size:13px;${fb.t===t?'background:var(--ac);color:var(--acb)':'color:var(--tx)'}" onclick="fbSync();fb.t='${t}';fbOpen()">${t}</button>`).join('')}</div>
<label>Mesajın</label><textarea id="fm" rows="6" maxlength="1500" placeholder="Ne yaşadın ya da ne önerirsin?">${esc(fb.msg||'')}</textarea>
<label>Cevap için e-postan</label><input id="fe" type="email" inputmode="email" value="${esc(em)}">
<div class="row" style="align-items:flex-start;margin-top:14px"><input type="checkbox" id="fd" style="width:20px;min-height:0;margin-top:3px" ${fb.dev===false?'':'checked'}><span style="font-size:14px">Uygulama sürümü ve cihaz bilgisini ekle <span class="mu">(hatayı çözmeye yardım eder)</span></span></div>
<div class="card" style="margin-top:14px"><p class="mu">Gönder'e basınca mesajın e-posta uygulamanda hazır açılır, göndermek için senin onayın gerekir. Cevap e-postası spam klasörüne düşebilir, onu da kontrol et.</p></div>
<div class="err" id="fer"></div>
<div class="row"><button class="btn g" style="flex:1" onclick="closeM()">Vazgeç</button><button class="btn g" style="flex:1" onclick="fbCopy()">Kopyala</button><button class="btn" style="flex:1" onclick="fbGo()">Gönder</button></div>`)}
function fbCheck(){const m=(fb.msg||'').trim(),e=(fb.em||'').trim();return m.length<10?'Mesajın en az 10 karakter olsun.':!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)?'Cevap alabilmem için geçerli bir e-posta yaz.':''}
function fbText(){const u=S.user||{};const sub=`[Sınav Takip] ${fb.t} - ${u.name||'Kullanıcı'}`;
let body=`Tür: ${fb.t}\nAd: ${u.name||''}\nCevap e-postası: ${(fb.em||'').trim()}\nSınav / bölüm: ${u.exam||''} / ${u.track||''}\n\nMesaj:\n${(fb.msg||'').trim()}\n`;
if(fb.dev!==false)body+=`\n--\nUygulama: Sınav Takip v${VER}\nCihaz: ${(navigator.userAgent||'').slice(0,160)}\n`;return{sub,body}}
function fbGo(){fbSync();const er=fbCheck();if(er){$('#fer').textContent=er;return}const t=fbText();
const a=document.createElement('a');a.href=`mailto:${MAIL}?subject=${encodeURIComponent(t.sub)}&body=${encodeURIComponent(t.body)}`;document.body.appendChild(a);a.click();a.remove();toast('E-posta uygulaman açılıyor…')}
function copyTxt(v){const t=document.createElement('textarea');t.value=v;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(()=>toast('Kopyalandı'),()=>toast(ok?'Kopyalandı':'Kopyalanamadı'));else toast(ok?'Kopyalandı':'Kopyalanamadı')}
function fbCopy(){fbSync();const er=fbCheck();if(er){$('#fer').textContent=er;return}const t=fbText();copyTxt(`Alıcı: ${MAIL}\nKonu: ${t.sub}\n\n${t.body}`)}
function setPal(k){S.pal=k;save();render()}
function pSave(){const n=$('#pn').value.trim(),m=$('#pm').value.trim();if(!n){toast('Ad boş olamaz.');return}if(m&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)){toast('Geçerli bir e-posta yaz.');return}
const e=$('#pe').value,t=$('#pt').value,go2=()=>{S.user={...S.user,name:n,email:m,exam:e,track:t};cm={};save();render();toast('Profil güncellendi')};
if(e!==S.user.exam&&S.exams.length)ask('Sınav türü değişiyor. Eski denemelerin korunur ama yeni ders listesiyle uyuşmayabilir.',go2,'Evet, değiştir');else go2()}
function bk(){const j=JSON.stringify(S);modal(`<h1>Yedek</h1><p class="mu" style="margin:6px 0 10px">Dosya indirme telefonunda çalışmazsa metni kopyalayıp bir notta sakla; "Yedekten yükle" ile geri yükleyebilirsin.</p>
<textarea id="bt" rows="6" readonly>${esc(j)}</textarea>
<div class="row" style="margin-top:12px"><button class="btn" style="flex:1" onclick="cp()">Kopyala</button><button class="btn g" style="flex:1" onclick="dl()">Dosya indir</button></div>
<button class="btn g" style="width:100%;margin-top:10px" onclick="closeM()">Kapat</button>`)}
function cp(){S.lastBackup=Date.now();save();const t=$('#bt');t.focus();t.select();const f=()=>{try{document.execCommand('copy');toast('Kopyalandı')}catch(e){toast('Metni elle seçip kopyala')}};
try{navigator.clipboard.writeText(t.value).then(()=>toast('Kopyalandı'),f)}catch(e){f()}}
function dl(){if(isNat()){S.lastBackup=Date.now();save();shareFile('sinav-takip-yedek.json',JSON.stringify(S));return}try{S.lastBackup=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='sinav-takip-yedek.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Yedek indiriliyor')}catch(e){toast('İndirilemedi; metni kopyala.')}}
function rsForm(){modal(`<h1>Yedekten yükle</h1><p class="mu" style="margin:6px 0 10px">Yedek metnini aşağıya yapıştır veya dosya seç. Mevcut verilerin yedekle değiştirilir.</p>
<textarea id="rt" rows="6" placeholder="Yedek metni"></textarea><label>Ya da dosya seç</label><input type="file" accept=".json,application/json" onchange="rf(this)">
<div class="row" style="margin-top:14px"><button class="btn g" style="flex:1" onclick="closeM()">Vazgeç</button><button class="btn" style="flex:1" onclick="rb(_rt||$('#rt').value)">Yükle</button></div>`)}
let _rt='';
function rf(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{_rt=r.result;$('#rt').value='';$('#rt').placeholder='Dosya seçildi: '+f.name+' ('+(f.size/1048576).toFixed(1)+' MB)'};r.readAsText(f)}
const b2d=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)});
const d2b=u=>{const i=u.indexOf(','),m=u.slice(5,u.indexOf(';')),bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:m})};
async function bkFull(){modal(`<h1>Tam yedek</h1><p class="mu" style="margin-top:8px">Notlar ve fotoğraflar hazırlanıyor…</p>`);
try{const ns=await nAll(),out=[];for(const n of ns){const ph=[];for(const b of n.photos)ph.push(await b2d(b));out.push({...n,photos:ph})}
S.lastBackup=Date.now();save();_bj=JSON.stringify({v:2,state:S,notes:out});const j=_bj,bl=new Blob([j],{type:'application/json'}),url=URL.createObjectURL(bl);
modal(`<h1>Tam yedek hazır</h1><p class="mu" style="margin:6px 0 14px">${ns.length} not · ${(bl.size/1048576).toFixed(1)} MB. Notlar ve fotoğraflar dahil.</p>${isNat()?`<button class="btn" style="width:100%" onclick="shareFile('sinav-takip-tam-yedek.json',_bj)">Paylaş / kaydet</button>`:`<a class="btn" style="width:100%;text-decoration:none" href="${url}" download="sinav-takip-tam-yedek-${new Date().toISOString().slice(0,10)}.json">Dosyayı indir</a>`}<p class="mu" style="margin-top:12px">İndirme başlamazsa tarayıcının indirme iznini kontrol et.</p><button class="btn g" style="width:100%;margin-top:10px" onclick="closeM()">Kapat</button>`)}
catch(e){modal(`<h1>Yedek alınamadı</h1><p class="mu" style="margin:8px 0 14px">Bellek ya da depolama sorunu olabilir. Hızlı yedeği dene.</p><button class="btn g" style="width:100%" onclick="closeM()">Kapat</button>`)}}
function rb(t){try{const d=JSON.parse(t);
if(d&&d.state&&Array.isArray(d.notes)&&Array.isArray(d.state.exams)&&d.state.sched){const st=norm(d.state);
nClear().then(()=>Promise.all(d.notes.map(n=>nPut({...n,photos:(n.photos||[]).map(d2b)})))).then(()=>{S=st;save();NL=null;_nl=false;_rt='';closeM();tab='home';render();toast('Tam yedek yüklendi')}).catch(()=>toast('Notlar yüklenemedi.'));return}
if(!d||!Array.isArray(d.exams)||!d.sched)throw 0;S=norm(d);save();_rt='';closeM();tab='home';render();toast('Yedek yüklendi')}catch(e){toast('Geçersiz yedek.')}}
function rs(){ask('Tüm denemelerin, programların ve profilin silinecek. Bu işlem geri alınamaz.',()=>{S=def();save();nClear().catch(()=>{});NL=null;_nl=false;try{localStorage.removeItem(CK)}catch(e){}CH=[];tab='home';render();toast('Tüm veriler silindi')},'Evet, hepsini sil')}
/* ---------- kalıcı depolama, yedek hatırlatma, PWA ---------- */
let _db=null,_dirty=false,_lastAuto=0,_sn=[];
function snap(j,t){idb().then(d=>{const q=d.transaction('kv').objectStore('kv').get('snaps');q.onsuccess=()=>{let a=[];try{a=JSON.parse(q.result||'[]')}catch(e){}a.push({t,d:j});a=a.slice(-5);d.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(a),'snaps')}}).catch(()=>{})}
function autoBk(){if(!S.auto||!_dirty||!S.user)return;const n=Date.now();if(n-_lastAuto<3e5)return;_lastAuto=n;_dirty=false;S.lastBackup=n;
try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}idbSet(S);const j=JSON.stringify(S);snap(j,n);
if(!isNat())try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='sinav-takip-yedek-'+new Date(n).toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')autoBk()});addEventListener('pagehide',autoBk);
function snapForm(){idb().then(d=>{const q=d.transaction('kv').objectStore('kv').get('snaps');q.onsuccess=()=>{try{_sn=JSON.parse(q.result||'[]').reverse()}catch(e){_sn=[]}
modal(`<h1>Otomatik yedekler</h1><p class="mu" style="margin:6px 0 10px">Uygulamadan her çıkışında son 5 yedek tarayıcı içinde de saklanır.</p>${_sn.length?_sn.map((x,i)=>{let c=0;try{c=JSON.parse(x.d).exams.length}catch(e){}return `<div class="card row sp"><div><b>${esc(new Date(x.t).toLocaleString('tr-TR'))}</b><div class="mu">${c} deneme</div></div><button class="btn g s" onclick="snapRestore(${i})">Geri yükle</button></div>`}).join(''):'<div class="card mu">Henüz otomatik yedek yok. Veri girip uygulamadan çıkınca oluşur.</div>'}<button class="btn g" style="width:100%;margin-top:10px" onclick="closeM()">Kapat</button>`)}}).catch(()=>toast('Yedekler okunamadı.'))}
function snapRestore(i){const x=_sn[i];if(x)ask('Mevcut verilerin bu yedekle değiştirilecek.',()=>rb(x.d),'Evet, geri yükle')}
function idb(){return new Promise((ok,no)=>{if(_db)return ok(_db);try{const r=indexedDB.open('sinavTakip',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('notes'))d.createObjectStore('notes',{keyPath:'id'})};r.onsuccess=()=>{_db=r.result;ok(_db)};r.onerror=()=>no(r.error)}catch(e){no(e)}})}
function idbSet(v){idb().then(d=>{d.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(v),K)}).catch(()=>{})}
function idbGet(){return idb().then(d=>new Promise((ok,no)=>{const q=d.transaction('kv').objectStore('kv').get(K);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}))}
function bkCard(){if(!S.user||!S.exams.length)return'';const d=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):99;
return d>=7?`<div class="card w row sp"><div><b>Yedek zamanı</b><div class="mu">${S.lastBackup?d+' gündür yedek almadın.':'Henüz yedek almadın.'}</div></div><button class="btn s" onclick="bk()">Yedek al</button></div>`:''}
function pst(){try{navigator.storage.persisted().then(p=>{const e=$('#ps');if(e)e.textContent=p?'Kalıcı depolama açık: tarayıcı verilerini kendiliğinden silmez.':'Kalıcı depolama henüz verilmedi. Uygulamayı ana ekrana ekleyip oradan açarsan genelde verilir.'})}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(!S.user&&!S.exams.length){idbGet().then(v=>{if(!v)return;const d=norm(JSON.parse(v));if(d.user||d.exams.length){S=d;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();toast('Verilerin geri yüklendi')}}).catch(()=>{})}
if('serviceWorker' in navigator&&!window.Capacitor)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

['prof','[data-tour=pf-rem]','Hatırlatıcılar','Anahtarı açınca ders ve çalışma saatinden önce bildirim gelir. Kaç dakika önce haber vereceğini ve teşvik mesajı isteyip istemediğini seçersin. Telefon bildirim izni isteyecek.'],
['prof','[data-tour=pf-guide]','Rehber','Bu rehberi istediğin zaman baştan ya da sadece merak ettiğin bölümden yeniden başlatabilirsin.'],
['prof','[data-tour=pf-feedback]','Geri bildirim','Şikayetini, önerini ya da bulduğun hatayı buradan yaz. Şikayetlere 3 saat içinde ilgilenilir, gerekirse sana geri dönülür.'],
['prof','[data-tour=pf-data]','Yedek ve veri','Yedek al, yedekten yükle, otomatik yedekleri gör. Veriler yalnızca bu cihazda durduğu için arada yedek almayı unutma.']];
let _ti=0,_ton=false;
function tour(i){_ton=true;_ti=i;closeM();tstep()}
function tstep(){const s=TOUR[_ti];if(!s)return tend();tab=s[0];render();scrollTo(0,0);
setTimeout(()=>{const el=$(s[1]);if(!el){_ti++;return tstep()}el.scrollIntoView({block:'center'});setTimeout(()=>tdraw(s),120)},60)}
function tdraw(s){let o=$('#tour');if(!o){o=document.createElement('div');o.id='tour';document.body.appendChild(o)}const last=_ti===TOUR.length-1;
o.innerHTML=`<div class="tx"></div><div class="th" id="th"></div><div class="tp" id="tp"><div class="mu">${_ti+1} / ${TOUR.length}</div><h2 style="margin:4px 0 6px">${s[2]}</h2><p>${s[3]}</p><div class="row sp" style="margin-top:14px"><button class="btn d" onclick="tend()">Rehberi geç</button><div class="row">${_ti?'<button class="btn g s" onclick="_ti--;tstep()">Geri</button>':''}<button class="btn" onclick="tnext()">${last?'Bitir':'Devam et'}</button></div></div></div>`;tpos()}
function tpos(){const s=TOUR[_ti];if(!_ton||!s)return;const el=$(s[1]),h=$('#th'),p=$('#tp');if(!el||!h||!p)return;const r=el.getBoundingClientRect(),d=6;
h.style.cssText=`left:${r.left-d}px;top:${r.top-d}px;width:${r.width+d*2}px;height:${r.height+d*2}px`;
if(r.top+r.height/2>innerHeight/2){p.style.top='calc(12px + env(safe-area-inset-top))';p.style.bottom='auto'}else{p.style.bottom='calc(12px + env(safe-area-inset-bottom))';p.style.top='auto'}}
function tnext(){_ti++;if(_ti>=TOUR.length)tend();else tstep()}
function tend(){_ton=false;const o=$('#tour');if(o)o.remove();S.tourDone=true;save();tab='home';render();scrollTo(0,0)}
/* ---------- hatırlatıcılar ---------- */
let _remS=null,_remTm=[];
const MOT=['Küçük adımlar büyük farklar yaratır.','Bugünkü emeğin, sınav günü rahatlığın olur.','Başlamak işin yarısı. Haydi!','Bir konu daha, hedefe bir adım daha yakın.','Önce çalış, sonra gönül rahatlığıyla dinlen.','Düzenli çalışan yorulmaz, kazanır.','Telefonu bırakıp masaya geçme zamanı.','Hedefin seni bekliyor.','Dünkü seni geçmek için bugünü değerlendir.','Az da olsa her gün, çok da olsa hiç değil.'];
const isNat=()=>{try{return !!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())}catch(e){return false}};
const LN=()=>{try{return Capacitor.Plugins.LocalNotifications||null}catch(e){return null}};
function remPlan(){const R=S.rem||{},out=[],now=Date.now(),lead=(+R.lead||10)*60000;
for(let off=0;off<7;off++){const dt=new Date();dt.setDate(dt.getDate()+off);const d=(dt.getDay()+6)%7;if(d===S.sched.rest)continue;
['kurum','kisisel'].forEach((k,pi)=>{const P=S.sched[k];P.slots.forEach((sl,i)=>{const v=P.cells[i+'|'+d];if(!v)return;const t=new Date(dt),h=sl[0].split(':');t.setHours(+h[0],+h[1],0,0);const at=t.getTime()-lead;if(at<=now)return;
const id=1000+off*100+pi*50+i;out.push({id,at,title:k==='kurum'?'Ders zamanı yaklaşıyor':'Çalışma zamanı yaklaşıyor',body:`${v} · ${sl[0]}–${sl[1]}`+(R.motiv!==false?'\n'+MOT[(id+off)%MOT.length]:'')})})})}
return out.sort((a,b)=>a.at-b.at).slice(0,60)}
async function remPerm(){try{if(isNat()&&LN()){let p=await LN().checkPermissions();if(p.display!=='granted')p=await LN().requestPermissions();return p.display==='granted'}
if(typeof Notification==='undefined')return false;if(Notification.permission==='granted')return true;return (await Notification.requestPermission())==='granted'}catch(e){return false}}
function webShow(t,b){try{if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'icon-192.png'})).catch(()=>{new Notification(t,{body:b})});else new Notification(t,{body:b})}catch(e){}}
async function remSync(){_remTm.forEach(clearTimeout);_remTm=[];const on=S.rem&&S.rem.on;
try{if(isNat()&&LN()){const pe=await LN().getPending();if(pe.notifications&&pe.notifications.length)await LN().cancel({notifications:pe.notifications});
if(on){const pl=remPlan();if(pl.length)await LN().schedule({notifications:pl.map(p=>({id:p.id,title:p.title,body:p.body,channelId:'program',schedule:{at:new Date(p.at),allowWhileIdle:true}}))})}return}}catch(e){}
if(!on)return;const lim=Date.now()+12*3600*1000;remPlan().filter(p=>p.at<lim).forEach(p=>_remTm.push(setTimeout(()=>webShow(p.title,p.body),p.at-Date.now())))}
async function remToggle(on){if(on&&!(await remPerm())){toast('Bildirim izni verilmedi. Telefon ayarlarından açabilirsin.');S.rem.on=false;save();render();return}
S.rem.on=on;save();await remSync();render();toast(on?'Hatırlatıcılar açıldı':'Hatırlatıcılar kapatıldı')}
function remSet(k,v){S.rem[k]=v;save()}
async function remTest(){if(!(await remPerm())){toast('Bildirim izni yok.');return}const t='Sınav Takip',b='Test bildirimi: hatırlatıcılar çalışıyor.\n'+MOT[Math.floor(Math.random()*MOT.length)];
try{if(isNat()&&LN()){await LN().schedule({notifications:[{id:9,title:t,body:b,channelId:'program',schedule:{at:new Date(Date.now()+3000)}}]});toast('3 saniye içinde bildirim gelecek');return}}catch(e){}webShow(t,b);toast('Bildirim gönderildi')}
if(S.rem&&S.rem.on)setTimeout(()=>remSync(),800);
/* ---------- yerel uygulama (Capacitor) ---------- */
let _mir=null,_bj='';
const NP=n=>{try{return Capacitor.Plugins[n]||null}catch(e){return null}};
async function mirrorWrite(){const F=NP('Filesystem');if(!isNat()||!F)return;try{await F.writeFile({path:'veri.json',data:JSON.stringify(S),directory:'DATA',encoding:'utf8'})}catch(e){}}
async function mirrorRestore(){const F=NP('Filesystem');if(!isNat()||!F||S.user||S.exams.length)return;
try{const r=await F.readFile({path:'veri.json',directory:'DATA',encoding:'utf8'}),d=norm(JSON.parse(r.data));if(d.user||d.exams.length){S=d;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();toast('Verilerin geri yüklendi')}}catch(e){}}
async function shareFile(name,text){try{const F=NP('Filesystem'),Sh=NP('Share');await F.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});const u=await F.getUri({path:name,directory:'CACHE'});await Sh.share({title:'Sınav Takip yedeği',files:[u.uri],dialogTitle:'Yedeği kaydet veya gönder'})}catch(e){toast('Paylaşılamadı.')}}
if(isNat()){mirrorRestore();
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="http"]'),B=NP('Browser');if(a&&B){e.preventDefault();B.open({url:a.href})}});
const A=NP('App');if(A)A.addListener('backButton',()=>{if(document.querySelector('.ov')){closeM();return}if(_ton){tend();return}if(tab!=='home'){go('home');return}A.exitApp()});
const L=LN();if(L)L.createChannel({id:'program',name:'Program hatırlatıcıları',description:'Ders ve çalışma saati bildirimleri',importance:4,visibility:1,vibration:true}).catch(()=>{})}
addEventListener('resize',tpos);addEventListener('scroll',tpos,{passive:true});
render();
</script></body></html>
