const lbl=e=>e.date?e.date.slice(8,10)+'.'+e.date.slice(5,7):'';
const r1=x=>Math.round(x*10)/10;
function cdata(){const ex=sorted();

function lineC(v,l,t){const W=320,H=180,L=30,R=14,T=20,B=28,n=v.length;let a=v.slice();if(t)a.push(t);let mn=Math.min(...a),mx=Math.max(...a);if(mn===mx){mn-=1;mx+=1}const pd=(mx-mn)*.18;mn-=pd;mx+=pd;
const X=i=>n===1?(L+W-R)/2:L+i*(W-L-R)/(n-1),Y=x=>T+(mx-x)/(mx-mn)*(H-T-B);
let g='';for(let k=0;k<4;k++){const val=mn+(mx-mn)*k/3,y=Y(val);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--bd)" stroke-width="1"/><text x="${L-5}" y="${y+3}" text-anchor="end">${r1(val)}</text>`}
const pts=v.map((x,i)=>X(i)+','+Y(x)).join(' ');
const area=n>1?`<path d="M${X(0)},${H-B} L${pts.replace(/ /g,' L')} L${X(n-1)},${H-B} Z" fill="var(--ac)" opacity=".13"/>`:'';
const tl=t?`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--wa)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${Y(t)-4}" text-anchor="end" style="fill:var(--wa)">hedef ${t}</text>`:'';
const st=Math.ceil(n/6);
const xl=l.map((x,i)=>(i%st===0||i===n-1)?`<text x="${X(i)}" y="${H-9}" text-anchor="middle">${esc(x)}</text>`:'').join('');
const dots=v.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x)}" r="4" fill="var(--bg)" stroke="var(--ac)" stroke-width="2"/>`+((n<=8||i===n-1)?`<text x="${X(i)}" y="${Y(x)-9}" text-anchor="middle" style="fill:var(--tx);font-weight:600">${r1(x)}</text>`:'')).join('');
return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}${area}${tl}${n>1?`<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>`:''}${dots}${xl}</svg>`}
function barC(r){const n=r.length,gw=50,W=Math.max(300,24+n*gw),H=180,T=20,B=28;const mx=Math.max(1,...r.map(x=>Math.max(x.d,x.y)))*1.15;const Y=v=>H-B-(v/mx)*(H-T-B);
const b=r.map((x,i)=>{const gx=12+i*gw+6;return `<rect x="${gx}" y="${Y(x.d)}" width="17" height="${H-B-Y(x.d)}" rx="4" fill="var(--ac)"/><rect x="${gx+20}" y="${Y(x.y)}" width="17" height="${H-B-Y(x.y)}" rx="4" fill="var(--er)" opacity=".85"/><text x="${gx+8}" y="${Y(x.d)-4}" text-anchor="middle" style="fill:var(--tx)">${x.d}</text><text x="${gx+28}" y="${Y(x.y)-4}" text-anchor="middle" style="fill:var(--tx)">${x.y}</text><text x="${gx+18}" y="${H-9}" text-anchor="middle">${esc(x.l)}</text>`}).join('');
return `<div class="sc" style="margin:0 -4px"><svg viewBox="0 0 ${W} ${H}" ${n>6?`width="${W}"`:'width="100%"'}><line x1="8" x2="${W-8}" y1="${H-B}" y2="${H-B}" stroke="var(--bd)"/>${b}</svg></div><div class="mu"><span style="color:var(--ac)">●</span> Doğru &nbsp; <span style="color:var(--er)">●</span> Yanlış</div>`}

let stt='';if(nv.length){const av=r1(nv.reduce((a,b)=>a+b,0)/nv.length),bs=r1(Math.max(...nv)),df=nv.length>1?r1(nv[nv.length-1]-nv[nv.length-2]):0;
stt=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">${mini(av,'ortalama')}${mini(bs,'en iyi')}${mini((df>0?'+':'')+df,'son değişim')}</div>`}

<div class="sc" style="margin:10px 0 6px;white-space:nowrap">${sl.map(n=>`<button class="chip" style="border:0;cursor:pointer;font:inherit;font-size:13px;${cg.s===n?'background:var(--ac);color:var(--acb)':'color:var(--tx)'}" data-s="${esc(n)}" onclick="cg.s=this.dataset.s;render()">${esc(n)}</button>`).join('')}</div>
${rows.length?(cg.m==='net'?lineC(nv,rows.map(r=>r.l),t):barC(rows)):'<p class="mu">Bu ders için henüz veri yok.</p>'}${stt}</div>`}

return `<h2>Ders durumu</h2><div class="card">`+ss.map(([n,c])=>{const s=series(n),l=s[s.length-1],t=+S.targets[n]||0,av=r1(s.reduce((a,b)=>a+b,0)/s.length);

function exams(){const e=sorted().reverse();
return `<div class="row sp"><h1>Denemeler</h1><button class="btn s" data-tour="ex-add" onclick="exForm()">${ic('plus')}Ekle</button></div>

${e.length?e.map(x=>`<div class="card"><div class="row sp"><div><b>${esc(x.name)}</b><div class="mu">${esc(x.date||'')}</div></div><div style="text-align:right"><b>${total(x)}</b><div class="mu">toplam net</div></div></div>

${Object.entries(x.wrong||{}).filter(a=>a[1].length).map(a=>`<div class="mu" style="margin-top:6px"><b>${esc(a[0])}</b> yanlış/boş konular: ${a[1].map(esc).join(', ')}</div>`).join('')}
<button class="btn d" style="margin-top:6px" onclick="delEx('${x.id}')">${ic('trash')}Sil</button></div>`).join(''):'<div class="card mu">Henüz deneme eklemedin.</div>'}`}

function exForm(){const s=subs(),t=new Date().toISOString().slice(0,10);
modal(`<h1>Yeni deneme</h1><label>Deneme adı</label><input id="xn" placeholder="Örn. TYT Deneme-1"><label>Tarih</label><input id="xd" type="date" value="${t}">
<h2>Doğru / yanlış</h2><div class="g3 mu"><span>Ders</span><span>Doğru</span><span>Yanlış</span><span>Net</span></div>
${s.map((a,i)=>`<div class="g3" style="margin-top:6px"><span>${esc(a[0])}<br><span class="mu">${a[1]} soru</span></span><input id="d${i}" type="number" min="0" max="${a[1]}" inputmode="numeric" oninput="ln(${i},${a[1]})"><input id="y${i}" type="number" min="0" max="${a[1]}" inputmode="numeric" oninput="ln(${i},${a[1]})"><b id="n${i}">0</b></div>`).join('')}

${s.map((a,i)=>`<details style="margin-top:8px"><summary>${esc(a[0])}</summary>${topics(a[0]).map(t=>`<label style="display:inline;margin:0"><input class="cb" type="checkbox" name="t${i}" value="${esc(t[0])}"><span class="chip">${esc(t[0])}</span></label>`).join('')}<input id="x${i}" placeholder="Diğer konular (virgülle)" style="margin-top:8px"></details>`).join('')}

function ln(i,c){const d=+$('#d'+i).value||0,y=+$('#y'+i).value||0;$('#n'+i).textContent=net(d,y);$('#n'+i).style.color=d+y>c?'var(--er)':''}

function tgForm(){modal(`<h1>Net hedeflerin</h1><p class="mu">Ders başına ulaşmak istediğin neti yaz.</p>
${subs().map((a,i)=>`<label>${esc(a[0])} (en fazla ${a[1]})</label><input id="g${i}" type="number" min="0" max="${a[1]}" step="0.25" value="${S.targets[a[0]]||''}">`).join('')}

/* ---------- program (tablo) ---------- */
const tm=s=>{const p=s.split(':');return +p[0]*60+ +p[1]},fm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function mkSlots(st,en,len,br){const a=[];let m=tm(st);const e=tm(en);while(m+len<=e){a.push([fm(m),fm(m+len)]);m+=len+br}return a}
function sched(){const P=S.sched[sp],r=S.sched.rest;
const table=P.slots.length?`<div class="sc"><table class="tb"><tr><th></th>${AB.map((d,i)=>`<th${i===r?' class="rh"':''}>${d}</th>`).join('')}</tr>${P.slots.map((s,i)=>`<tr><td class="t">${s[0]}<br>${s[1]}</td>${AB.map((d,j)=>{if(j===r)return `<td class="rs">${i===Math.floor((P.slots.length-1)/2)?'Dinlenme':''}</td>`;const v=P.cells[i+'|'+j];return `<td class="${v?'f':''}" onclick="cellForm(${i},${j})">${v?esc(v):'+'}</td>`}).join('')}</tr>`).join('')}</table></div><p class="mu">Bir hücreye dokunarak dersi değiştirebilir veya silebilirsin.</p><button class="btn d" onclick="clearT()">${ic('trash')}Tabloyu temizle</button>`
:`<div class="card mu">Tablo henüz boş. "Otomatik program" ile dersleri ve saatleri seç, 5 farklı program önerelim.</div>`;
return `<div class="row sp"><h1>Program</h1><button class="btn s" data-tour="sc-gen" onclick="genForm()">${ic('plus')}Otomatik program</button></div>
<div class="seg" data-tour="sc-tabs"><button class="${sp==='kurum'?'on':''}" onclick="sp='kurum';render()">Ders programı</button><button class="${sp==='kisisel'?'on':''}" onclick="sp='kisisel';render()">Çalışma programı</button></div>

<div class="card row sp" data-tour="sc-rest"><div><b>Dinlenme günü</b><div class="mu">Haftada bir gün zorunlu</div></div><select style="width:auto" onchange="setRest(this.value)">${DAYS.map((d,i)=>`<option value="${i}"${i===r?' selected':''}>${d}</option>`).join('')}</select></div>${table}`}
function setRest(v){S.sched.rest=+v;save();render();toast('Dinlenme günü: '+DAYS[+v])}
function clearT(){ask('Bu programın tüm hücreleri silinecek.',()=>{S.sched[sp].cells={};save();render();toast('Tablo temizlendi')},'Evet, temizle')}
let G={subj:null,st:'',en:'',ln:50,br:10},GV=[],GS=[];

function genForm(){const k=sp==='kisisel',b=subs().map(a=>a[0]);if(!G.subj)G.subj=b.slice();if(!G.st){G.st=k?'17:00':'08:30';G.en=k?'22:00':'15:30';G.ln=k?50:40;G.br=10}
modal(`<h1>Otomatik ${k?'çalışma':'ders'} programı</h1><p class="mu" style="margin:6px 0 4px">Dersleri ve saatleri seç, 5 farklı program önereyim; beğendiğini seçersin. Dinlenme günün (${DAYS[S.sched.rest]}) boş kalır, diğer 6 gün doldurulur.</p>
<label>Dersler</label><div>${b.map(n=>`<label style="display:inline;margin:0"><input class="cb" type="checkbox" name="gd" value="${esc(n)}" ${G.subj.includes(n)?'checked':''}><span class="chip">${esc(n)}</span></label>`).join('')}</div>
<div class="g2"><div><label>Başlangıç saati</label><input id="gs" type="time" value="${G.st}"></div><div><label>Bitiş saati</label><input id="ge" type="time" value="${G.en}"></div>
<div><label>Ders süresi (dk)</label><input id="gl" type="number" inputmode="numeric" min="10" max="180" value="${G.ln}"></div><div><label>Ara dinlenme (dk)</label><input id="gb" type="number" inputmode="numeric" min="0" max="60" value="${G.br}"></div></div>
<div class="err" id="ger"></div>
<div class="row stk"><button class="btn g" style="flex:1" onclick="closeM()">Vazgeç</button><button class="btn" style="flex:1" onclick="genMake()">5 program oluştur</button></div>
<button class="btn d" style="width:100%" onclick="genEmpty()">Sadece boş tablo oluştur</button>`)}
function genRead(){const e=$('#ger'),stt=$('#gs').value,en=$('#ge').value,l=+$('#gl').value,br=+$('#gb').value||0,subj=[...document.querySelectorAll('input[name=gd]:checked')].map(c=>c.value);

const sl=mkSlots(stt,en,l,br);if(!sl.length){e.textContent='Bu aralığa hiç ders sığmıyor.';return null}if(sl.length>14){e.textContent='En fazla 14 satır olabilir. Aralığı daralt.';return null}

function genEmpty(){const r=genRead();if(!r)return;const P=S.sched[sp];P.slots=r.sl;P.cells={};save();closeM();render();toast('Boş tablo hazır')}
function genVariants(subj,nS){const days=[0,1,2,3,4,5,6].filter(d=>d!==S.sched.rest),m=subj.length,qn=Object.fromEntries(subs().map(a=>[a[0],a[1]]));
const sc=subj.map(n=>{const r=coachSub(n,qn[n]||40);return r?Math.max(.2,r.sc):1}),mx=Math.max(...sc),ord=subj.map((n,i)=>i).sort((a,b)=>sc[b]-sc[a]).map(i=>subj[i]),wl=[];
subj.forEach((n,i)=>{const w=1+Math.round(sc[i]/mx*2);for(let k=0;k<w;k++)wl.push(n)});
const mk=f=>{const c={};days.forEach((d,di)=>{for(let i=0;i<nS;i++)c[i+'|'+d]=f(di,i)});return c};
return [
{n:'Dengeli döngü',d:'Dersler her gün sırayla döner, hepsine eşit pay verilir.',c:mk((di,i)=>subj[(i+di*2)%m])},
{n:'Zayıflara ağırlık',d:'Neti düşük ya da hedefe uzak dersler daha sık yer alır.',c:mk((di,i)=>wl[(i+di*3)%wl.length])},
{n:'Günlük odak',d:'Her gün 2 derse odaklanılır, bloklar hâlinde çalışılır.',c:mk((di,i)=>{const f=[subj[(2*di)%m],subj[(2*di+1)%m]];return f[Math.floor(i/2)%2]})},
{n:'Zor dersler önce',d:'Öncelikli dersler günün ilk saatlerinde yer alır.',c:mk((di,i)=>ord[(i+di%Math.min(3,m))%m])},
{n:'Karma düzen',d:'Dersler her gün farklı sırayla, tekrar etmeden karışır.',c:mk((di,i)=>{const o=subj.slice();let sd=(di+1)*7919;for(let k=o.length-1;k>0;k--){sd=(sd*9301+49297)%233280;const j=Math.floor(sd/233280*(k+1));[o[k],o[j]]=[o[j],o[k]]}return o[i%m]})}]}
function pvHtml(c){const idx=Object.fromEntries(G.subj.map((n,i)=>[n,i]));

function genApply(i){const P=S.sched[sp];P.slots=GS;P.cells={...GV[i].c};save();closeM();render();toast('Program uygulandı')}

const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sdv=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
function slope(a){const n=a.length,mx=(n-1)/2,my=mean(a);let nu=0,de=0;a.forEach((y,i)=>{nu+=(i-mx)*(y-my);de+=(i-mx)**2});return de?nu/de:0}
function trendOf(a,thr){const m=a.length;if(m<2)return{k:'yok',m};const sl=m===2?a[1]-a[0]:slope(a.slice(-5));return{k:sl>=thr?'up':sl<=-thr?'down':'flat',m,sl}}
function coachSub(n,c){const ex=sorted().filter(e=>e.res[n]);if(!ex.length)return null;
const sr=ex.map(e=>eNet(e,n)),k=Math.min(3,sr.length),av=mean(sr.slice(-k)),t=+S.targets[n]||0,L=ex.slice(-k).map(e=>e.res[n]);
const dA=mean(L.map(r=>r.d)),yA=mean(L.map(r=>r.y)),bA=Math.max(0,c-dA-yA),bR=bA/c,tr=trendOf(sr,Math.max(.5,.02*c)),ft=freq().filter(x=>x.d===n&&x.c>=2),seq=sr.slice(-4).map(r1).join(' → ');
const R=[];let sc=0;
if(t>0){const g=t-av;if(g>.25){R.push(`Hedefe ${r1(g)} net uzaktasın (son ${k} deneme ortalaması ${r1(av)}, hedef ${t}).`);sc+=g}else R.push(`Hedefe ulaşmış görünüyorsun (ortalama ${r1(av)}, hedef ${t}).`)}
else{sc+=(c-av)*.3;R.push(`Son ${k} deneme ortalaman ${r1(av)} / ${c}. Hedef belirlersen öncelik sıralaması daha isabetli olur.`)}
if(tr.k==='down'){R.push(`Net düşüşte (${seq}).`);sc+=1.5}else if(tr.k==='up')R.push(`Net yükselişte (${seq}).`);else if(tr.k==='flat')R.push(`Net sabit seyrediyor (${seq}).`);
if(bR>=.25){R.push(`Soruların yaklaşık %${Math.round(bR*100)}'i boş kalıyor; önce konu eksiğini gider.`);sc+=1}
else if(dA+yA>0&&yA/(dA+yA)>=.25&&bR<.15)R.push(`Cevapladıklarının %${Math.round(yA/(dA+yA)*100)}'i yanlış, boş az. Emin olmadığın sorularda boş bırakmak neti artırabilir (4 yanlış 1 doğruyu götürür).`);
if(sr.length>=3&&sdv(sr.slice(-5))>=Math.max(2,.12*c))R.push(`Net denemeler arasında dalgalı (±${r1(sdv(sr.slice(-5)))}); düzenli soru çözümü tutarlılığı artırır.`);
if(ft.length){R.push(`Tekrar eden yanlış konular: ${ft.slice(0,3).map(x=>x.t).join(', ')}.`);sc+=Math.min(2,ft.length*.5)}
return{n,c,av,t,tr,R,sc,seq,last:sr[sr.length-1]}}

function bGoal(d){const L=d.res.filter(r=>r.t>0);if(!L.length)return `<b>Hedefler</b><br>Hedef net koymamışsın. Ana sayfadaki Hedeflerim kartından ekleyebilirsin.`;

function fbSync(){const m=$('#fm'),e=$('#fe'),d=$('#fd'),sc=$('#fs');if(m&&m.value!==undefined)fb.msg=m.value;if(e&&e.value!==undefined)fb.em=e.value;if(d&&d.checked!==undefined)fb.dev=d.checked;if(sc&&sc.value!==undefined)fb.scr=sc.value}
function fbSug(){fbSync();const q=nz(fb.msg||''),el=$('#fsg');if(!el)return;const hit=q.length>10?FAQ.map(f=>({f,s:f.k.filter(w=>(' '+q).includes(' '+w)).length})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,2):[];
el.innerHTML=hit.length?`<div class="mu" style="margin-top:10px">Cevap burada olabilir:</div>`+hit.map(x=>`<button class="qr" style="margin:6px 6px 0 0;white-space:normal;text-align:left" data-q="${esc(x.f.q)}" onclick="faqOpen(this.dataset.q)">${esc(x.f.q)}</button>`).join(''):''}
function fbOpen(){const u=S.user||{},em=fb.em!==undefined?fb.em:(u.email||''),ch=(arr,cur,set)=>arr.map(t=>`<button class="chip" style="border:0;cursor:pointer;font:inherit;font-size:13px;${cur===t?'background:var(--ac);color:var(--acb)':'color:var(--tx)'}" onclick="fbSync();${set}='${t}';fbOpen()">${t}</button>`).join('');
modal(`<div class="row sp"><h1>Geri bildirim</h1><button class="btn d" onclick="closeM()">Kapat</button></div><p class="mu" style="margin:6px 0 4px">Şikayetin 3 saat içinde ilgilenilecek, gerekirse sana geri dönüş yapılacak.</p>
<label>Tür</label><div>${ch(['Şikayet','Öneri','Hata bildirimi','Soru','Diğer'],fb.t,'fb.t')}</div>
<label>Hangi ekranda?</label><select id="fs">${opts(['Genel','Ana sayfa','Denemeler','Program','Süre','Notlar','Koç','Profil'],fb.scr||'Genel')}</select>
<label>Mesajın</label><textarea id="fm" rows="6" maxlength="1500" placeholder="Ne yaşadın ya da ne önerirsin? Hata ise ne yaptığını ve ne olduğunu yaz." oninput="fbSug()">${esc(fb.msg||'')}</textarea><div id="fsg"></div>

<div class="card" style="margin-top:14px"><p class="mu">Gönder'e basınca mesajın e-posta uygulamanda hazır açılır, göndermek için senin onayın gerekir. Cevap e-postası spam klasörüne düşebilir, onu da kontrol et.</p></div>

<div class="row stk"><button class="btn g" style="flex:1" onclick="closeM()">Vazgeç</button><button class="btn g" style="flex:1" onclick="fbCopy()">Kopyala</button><button class="btn" style="flex:1" onclick="fbGo()">Gönder</button></div>`);fbSug()}
function fbCheck(){const m=(fb.msg||'').trim(),e=(fb.em||'').trim();return m.length<10?'Mesajın en az 10 karakter olsun.':!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)?'Cevap alabilmem için geçerli bir e-posta yaz.':''}
function fbText(){const u=S.user||{};const sub=`[Sınav Takip] ${fb.t} - ${u.name||'Kullanıcı'}`;
let body=`Tür: ${fb.t}\nEkran: ${fb.scr||'Genel'}\nAd: ${u.name||''}\nCevap e-postası: ${(fb.em||'').trim()}\nSınav / bölüm: ${u.exam||''} / ${u.track||''}\n${fb.rate?'Memnuniyet: '+fb.rate+' / 5\n':''}\nMesaj:\n${(fb.msg||'').trim()}\n`;
if(fb.dev!==false)body+=`\n--\nUygulama: Sınav Takip v${VER}\nCihaz: ${(navigator.userAgent||'').slice(0,160)}\n`;return{sub,body}}
function fbGo(){fbSync();const er=fbCheck();if(er){$('#fer').textContent=er;return}const t=fbText();
const a=document.createElement('a');a.href=`mailto:${MAIL}?subject=${encodeURIComponent(t.sub)}&body=${encodeURIComponent(t.body)}`;document.body.appendChild(a);a.click();a.remove();toast('E-posta uygulaman açılıyor…')}
function copyTxt(v){const t=document.createElement('textarea');t.value=v;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(()=>toast('Kopyalandı'),()=>toast(ok?'Kopyalandı':'Kopyalanamadı'));else toast(ok?'Kopyalandı':'Kopyalanamadı')}
function fbCopy(){fbSync();const er=fbCheck();if(er){$('#fer').textContent=er;return}const t=fbText();copyTxt(`Alıcı: ${MAIL}\nKonu: ${t.sub}\n\n${t.body}`)}
function setPal(k){S.pal=k;save();render()}
function pSave(){const n=$('#pn').value.trim(),m=$('#pm').value.trim();if(!n){toast('Ad boş olamaz.');return}if(m&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)){toast('Geçerli bir e-posta yaz.');return}
const e=$('#pe').value,t=$('#pt').value,go2=()=>{S.user={...S.user,name:n,email:m,exam:e,track:t};cm={};save();render();toast('Profil güncellendi')};
if(e!==S.user.exam&&S.exams.length)ask('Sınav türü değişiyor. Eski denemelerin korunur ama yeni ders listesiyle uyuşmayabilir.',go2,'Evet, değiştir');else go2()}
function bk(){const j=JSON.stringify(S);modal(`<h1>Yedek</h1><p class="mu" style="margin:6px 0 10px">Dosya indirme telefonunda çalışmazsa metni kopyalayıp bir notta sakla; "Yedekten yükle" ile geri yükleyebilirsin.</p>

<div class="row" style="margin-top:12px"><button class="btn" style="flex:1" onclick="cp()">Kopyala</button><button class="btn g" style="flex:1" onclick="dl()">Dosya indir</button></div>
<button class="btn g" style="width:100%;margin-top:10px" onclick="closeM()">Kapat</button>`)}
function cp(){S.lastBackup=Date.now();save();const t=$('#bt');t.focus();t.select();const f=()=>{try{document.execCommand('copy');toast('Kopyalandı')}catch(e){toast('Metni elle seçip kopyala')}};
try{navigator.clipboard.writeText(t.value).then(()=>toast('Kopyalandı'),f)}catch(e){f()}}
function dl(){if(isNat()){S.lastBackup=Date.now();save();shareFile('sinav-takip-yedek.json',JSON.stringify(S));return}try{S.lastBackup=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='sinav-takip-yedek.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Yedek indiriliyor')}catch(e){toast('İndirilemedi; metni kopyala.')}}
function rsForm(){modal(`<h1>Yedekten yükle</h1><p class="mu" style="margin:6px 0 10px">Yedek metnini aşağıya yapıştır veya dosya seç. Mevcut verilerin yedekle değiştirilir.</p>
<textarea id="rt" rows="6" placeholder="Yedek metni"></textarea><label>Ya da dosya seç</label><input type="file" accept=".json,application/json" onchange="rf(this)">
<div class="row" style="margin-top:14px"><button class="btn g" style="flex:1" onclick="closeM()">Vazgeç</button><button class="btn" style="flex:1" onclick="rb(_rt||$('#rt').value)">Yükle</button></div>`)}
let _rt='';
function rf(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{_rt=r.result;$('#rt').value='';$('#rt').placeholder='Dosya seçildi: '+f.name+' ('+(f.size/1048576).toFixed(1)+' MB)'};r.readAsText(f)}
const b2d=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)});
const d2b=u=>{const i=u.indexOf(','),m=u.slice(5,u.indexOf(';')),bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:m})};
async function bkFull(){modal(`<h1>Tam yedek</h1><p class="mu" style="margin-top:8px">Notlar ve fotoğraflar hazırlanıyor…</p>`);
try{const ns=await nAll(),out=[];for(const n of ns){const ph=[];for(const b of n.photos)ph.push(await b2d(b));out.push({...n,photos:ph})}
S.lastBackup=Date.now();save();_bj=JSON.stringify({v:2,state:S,notes:out});const j=_bj,bl=new Blob([j],{type:'application/json'}),url=URL.createObjectURL(bl);
modal(`<h1>Tam yedek hazır</h1><p class="mu" style="margin:6px 0 14px">${ns.length} not · ${(bl.size/1048576).toFixed(1)} MB. Notlar ve fotoğraflar dahil.</p>${isNat()?`<button class="btn" style="width:100%" onclick="shareFile('sinav-takip-tam-yedek.json',_bj)">Paylaş / kaydet</button>`:`<a class="btn" style="width:100%;text-decoration:none" href="${url}" download="sinav-takip-tam-yedek-${new Date().toISOString().slice(0,10)}.json">Dosyayı indir</a>`}<p class="mu" style="margin-top:12px">İndirme başlamazsa tarayıcının indirme iznini kontrol et.</p><button class="btn g" style="width:100%;margin-top:10px" onclick="closeM()">Kapat</button>`)}
catch(e){modal(`<h1>Yedek alınamadı</h1><p class="mu" style="margin:8px 0 14px">Bellek ya da depolama sorunu olabilir. Hızlı yedeği dene.</p><button class="btn g" style="width:100%" onclick="closeM()">Kapat</button>`)}}
function rb(t){try{const d=JSON.parse(t);
if(d&&d.state&&Array.isArray(d.notes)&&Array.isArray(d.state.exams)&&d.state.sched){const st=norm(d.state);
nClear().then(()=>Promise.all(d.notes.map(n=>nPut({...n,photos:(n.photos||[]).map(d2b)})))).then(()=>{S=st;save();NL=null;_nl=false;_rt='';closeM();tab='home';render();toast('Tam yedek yüklendi')}).catch(()=>toast('Notlar yüklenemedi.'));return}
if(!d||!Array.isArray(d.exams)||!d.sched)throw 0;S=norm(d);save();_rt='';closeM();tab='home';render();toast('Yedek yüklendi')}catch(e){toast('Geçersiz yedek.')}}
function rs(){ask('Tüm denemelerin, programların ve profilin silinecek. Bu işlem geri alınamaz.',()=>{S=def();save();nClear().catch(()=>{});NL=null;_nl=false;try{localStorage.removeItem(CK)}catch(e){}CH=[];tab='home';render();toast('Tüm veriler silindi')},'Evet, hepsini sil')}
/* ---------- kalıcı depolama, yedek hatırlatma, PWA ---------- */
let _db=null,_dirty=false,_lastAuto=0,_sn=[];
function snap(j,t){idb().then(d=>{const q=d.transaction('kv').objectStore('kv').get('snaps');q.onsuccess=()=>{let a=[];try{a=JSON.parse(q.result||'[]')}catch(e){}a.push({t,d:j});a=a.slice(-5);d.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(a),'snaps')}}).catch(()=>{})}
function autoBk(){if(!S.auto||!_dirty||!S.user)return;const n=Date.now();if(n-_lastAuto<3e5)return;_lastAuto=n;_dirty=false;S.lastBackup=n;
try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}idbSet(S);const j=JSON.stringify(S);snap(j,n);
if(!isNat())try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='sinav-takip-yedek-'+new Date(n).toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')autoBk()});addEventListener('pagehide',autoBk);
function snapForm(){idb().then(d=>{const q=d.transaction('kv').objectStore('kv').get('snaps');q.onsuccess=()=>{try{_sn=JSON.parse(q.result||'[]').reverse()}catch(e){_sn=[]}
modal(`<h1>Otomatik yedekler</h1><p class="mu" style="margin:6px 0 10px">Uygulamadan her çıkışında son 5 yedek tarayıcı içinde de saklanır.</p>${_sn.length?_sn.map((x,i)=>{let c=0;try{c=JSON.parse(x.d).exams.length}catch(e){}return `<div class="card row sp"><div><b>${esc(new Date(x.t).toLocaleString('tr-TR'))}</b><div class="mu">${c} deneme</div></div><button class="btn g s" onclick="snapRestore(${i})">Geri yükle</button></div>`}).join(''):'<div class="card mu">Henüz otomatik yedek yok. Veri girip uygulamadan çıkınca oluşur.</div>'}<button class="btn g" style="width:100%;margin-top:10px" onclick="closeM()">Kapat</button>`)}}).catch(()=>toast('Yedekler okunamadı.'))}
function snapRestore(i){const x=_sn[i];if(x)ask('Mevcut verilerin bu yedekle değiştirilecek.',()=>rb(x.d),'Evet, geri yükle')}
function idb(){return new Promise((ok,no)=>{if(_db)return ok(_db);try{const r=indexedDB.open('sinavTakip',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('notes'))d.createObjectStore('notes',{keyPath:'id'})};r.onsuccess=()=>{_db=r.result;ok(_db)};r.onerror=()=>no(r.error)}catch(e){no(e)}})}
function idbSet(v){idb().then(d=>{d.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(v),K)}).catch(()=>{})}
function idbGet(){return idb().then(d=>new Promise((ok,no)=>{const q=d.transaction('kv').objectStore('kv').get(K);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}))}
function bkCard(){if(!S.user||!S.exams.length)return'';const d=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):99;
return d>=7?`<div class="card w row sp"><div><b>Yedek zamanı</b><div class="mu">${S.lastBackup?d+' gündür yedek almadın.':'Henüz yedek almadın.'}</div></div><button class="btn s" onclick="bk()">Yedek al</button></div>`:''}
function pst(){try{navigator.storage.persisted().then(p=>{const e=$('#ps');if(e)e.textContent=p?'Kalıcı depolama açık: tarayıcı verilerini kendiliğinden silmez.':'Kalıcı depolama henüz verilmedi. Uygulamayı ana ekrana ekleyip oradan açarsan genelde verilir.'})}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(!S.user&&!S.exams.length){idbGet().then(v=>{if(!v)return;const d=norm(JSON.parse(v));if(d.user||d.exams.length){S=d;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();toast('Verilerin geri yüklendi')}}).catch(()=>{})}

const PM=[['kucuk','Küçük'],['orta','Orta'],['buyuk','Büyük'],['orijinal','Orijinal']];
const pdfScaleFor=(mode,pw,cw)=>{const fit=Math.max(.2,(cw-20)/pw);return mode==='kucuk'?fit*.7:mode==='buyuk'?fit*1.6:mode==='orijinal'?96/72:fit};
const $$=id=>document.getElementById(id);
function loadPdfJs(){return new Promise((ok,no)=>{if(window.pdfjsLib)return ok();const sc=document.createElement('script');sc.src='pdf.min.js';sc.onload=()=>{try{pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';ok()}catch(e){no(e)}};sc.onerror=()=>no(new Error('PDF görüntüleyici dosyası bulunamadı.'));document.head.appendChild(sc)})}
function pdfRelease(p){if(p.done||p.canvas.width){p.canvas.width=0;p.canvas.height=0}p.done=false}
async function pdfRender(p){if(p.busy||p.done)return;p.busy=true;const g=V.gen;try{const pg=await V.doc.getPage(p.n),dpr=Math.min(window.devicePixelRatio||1,1.5),vp=pg.getViewport({scale:p.sc*dpr}),c=p.canvas;
c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.style.width=Math.floor(vp.width/dpr)+'px';c.style.height=Math.floor(vp.height/dpr)+'px';
await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;if(g===V.gen)p.done=true;else pdfRelease(p)}catch(e){}finally{p.busy=false}}
function pdfTick(){if(!V.doc)return;const vh=innerHeight,vis=V.pages.filter(p=>!p.hidden);let cur=0;
vis.forEach((p,i)=>{const r=p.w.getBoundingClientRect();if(r.bottom>-1200&&r.top<vh+1200)pdfRender(p);else pdfRelease(p);if(!cur&&r.bottom>vh*.4)cur=i+1});
const e=$$('pdfp');if(e)e.textContent='Sayfa '+(cur||vis.length)+' / '+vis.length}
function pdfLayout(){const cw=$$('pdfc').clientWidth||innerWidth;V.gen++;V.pages.forEach(p=>{p.sc=pdfScaleFor(V.mode,p.pw,cw);p.w.style.width=Math.round(p.pw*p.sc)+'px';p.w.style.height=Math.round(p.ph*p.sc)+'px';p.w.style.display=p.hidden?'none':'';pdfRelease(p)});pdfTick()}
function pdfMode(m){const c=$$('pdfc'),ratio=c.scrollHeight?c.scrollTop/c.scrollHeight:0;V.mode=m;S.exm.mode=m;save();
document.querySelectorAll('#pdfm button').forEach(b=>b.classList&&b.classList[b.dataset.m===m?'add':'remove']('on'));pdfLayout();c.scrollTop=ratio*c.scrollHeight}
/* ---------- cevap anahtarı + cevap kâğıdı ---------- */
const keyRe=()=>/(?:^|[^0-9])(\d{1,3})\s*[.\-–—:)\]]?\s*([A-E])(?![A-Za-z0-9ÇĞİÖŞÜçğıöşü])/g;
function parseKeyText(txt){const re=keyRe(),secs=[];let cur=null,x;
while((x=re.exec(txt))){const n=+x[1],l=x[2];if(!n)continue;if(!cur||n<=cur.last){cur={map:{},last:0};secs.push(cur)}cur.map[n]=l;cur.last=n}
return secs.map(c=>{const mx=Math.max(...Object.keys(c.map).map(Number));return Array.from({length:mx},(_,i)=>c.map[i+1]||'')}).filter(a=>a.filter(Boolean).length>=3)}
async function pdfKey(f){const c=S.exm.key[f.rel];if(c&&c.m===f.mtime&&c.sec&&(c.sec.length||c.manual))return c;
const N=V.doc.numPages,parts=[],pages=[];for(let n=Math.max(1,N-7);n<=N;n++){const pg=await V.doc.getPage(n),tc=await pg.getTextContent(),txt=tc.items.map(i=>i.str).join(' '),cnt=(txt.match(keyRe())||[]).length;if(cnt>=10&&cnt*5/txt.length>=.25){parts.push(txt);pages.push(n)}}
const k={m:f.mtime,sec:parseKeyText(parts.join(' \n ')),pages};S.exm.key[f.rel]=k;save();return k}
async function pdfKeyInit(){const doc=V.doc;try{const k=await pdfKey(V.f);if(V.doc!==doc)return;V.key=k}catch(e){V.key={sec:[],pages:[]}}const pg=S.exm.prog[V.f.rel];V.hideKey=!(pg&&pg.done);keyApply()}
function keyApply(){const k=V.key;V.pages.forEach(p=>{p.hidden=!!(V.hideKey&&k&&k.pages&&k.pages.includes(p.n))});pdfLayout()}
function keyHide(b){V.hideKey=!!b;keyApply()}
const progOf=()=>S.exm.prog[V.f.rel]||(S.exm.prog[V.f.rel]={a:[]});
function sheetToggle(){const o=$$('pdfs');if(o){o.remove();return}const d=document.createElement('div');d.id='pdfs';$$('pdfv').appendChild(d);sheetRender()}
const exDur=f=>exRank(f.name)===0?135:exRank(f.name)===1?180:120;
const pTime2=pr=>(pr.acc||0)+(pr.run?(Date.now()-pr.start)/1000:0);
const pRemain=pr=>(pr.dur||exDur(V.f))*60-pTime2(pr);
function secNames(f,k){const n=k.sec.length,r=exRank(f.name),tyt=TYT.map(a=>a[0].replace(/^TYT /,'')),ayt=(YA[S.user.track]||[]).map(a=>a[0].replace(/^AYT /,''));
if(r===0&&n===4)return tyt;if(r===1&&n>0&&n===ayt.length)return ayt;return k.sec.map((_,i)=>'Bölüm '+(i+1))}
function sheetScore(k,pr){let g=0;const secs=k.sec.map(a=>{let d=0,y=0,b=0,u=0;const wrong=[],blank=[];a.forEach((kl,qi)=>{const an=pr.a[g++]||'';if(!an){b++;blank.push(qi+1)}else if(!kl)u++;else if(an===kl)d++;else{y++;wrong.push(qi+1)}});return{n:a.length,d,y,b,u,net:Math.round((d-y/4)*100)/100,wrong,blank}});
const t=secs.reduce((o,x)=>({d:o.d+x.d,y:o.y+x.y,b:o.b+x.b,u:o.u+x.u}),{d:0,y:0,b:0,u:0});return{secs,...t,net:Math.round((t.d-t.y/4)*100)/100}}
function pStart(){const pr=progOf();if(pr.run||pr.done)return;pr.start=Date.now();pr.run=true;save();sheetRender()}
function pPause(){const pr=progOf();if(!pr.run)return;pr.acc=pTime2(pr);pr.run=false;save();sheetRender()}
function pDur(v){const pr=progOf();pr.dur=Math.max(1,Math.min(600,+v||exDur(V.f)));save();pdfTimerTick()}
function pdfTimerTick(){if(!V.f||!V.doc)return;const pr=S.exm.prog[V.f.rel];if(!pr||pr.done)return;const e=$$('pdft');if(e)e.textContent=fmtT(Math.max(0,pRemain(pr)));if(pr.run&&pRemain(pr)<=0){pr.acc=pTime2(pr);pr.run=false;save();toast('Süre doldu');sheetRender()}}
function exSubjNames(f,k){const n=k.sec.length,r=exRank(f.name),u=S.user;
if(u.exam==='YKS'){if(r===0&&n===4)return TYT.map(a=>a[0]);const ay=YA[u.track]||[];if(r===1&&n===ay.length)return ay.map(a=>a[0])}
const sb=subs().map(a=>a[0]);return(r>1&&n===sb.length)?sb:null}
function sheetAddExam(){const pr=progOf(),r=pr.res;if(!r)return;if(pr.added&&S.exams.some(e=>e.id===pr.added)){toast("Bu sınav zaten Denemelerim'de.");return}
const nm=exSubjNames(V.f,V.key),res={};r.secs.forEach((x,i)=>{res[nm?nm[i]:'Bölüm '+(i+1)]={d:x.d,y:x.y}});

const exAddBtn=()=>{const pr=progOf();return (pr.added&&S.exams.some(e=>e.id===pr.added))?'<div class="card mu" style="margin:8px 0;text-align:center">Denemelerime eklendi ✓</div>':'<button class="btn" style="width:100%;margin:8px 0" onclick="sheetAddExam()">Denemelerime ekle</button>'};
function sheetKeyEdit(){V.setup=true;sheetRender()}
function sheetFinish(){const pr=progOf(),k=V.key;if(!k.sec.some(a=>a.some(Boolean))){toast('Cevap anahtarı yok, net hesaplanamaz. Anahtarı ekle.');return}

ask(`${bos} soru boş. Sınavı bitirip sonucu görmek istiyor musun?`,()=>{pr.acc=pTime2(pr);pr.run=false;pr.done=true;pr.res=sheetScore(k,pr);pr.res.t=Math.round(pr.acc);pr.res.at=Date.now();V.hideKey=false;save();keyApply();sheetRender()},'Evet, bitir')}
function sheetRedo(){ask('Bu sınavın işaretlemeleri ve sonucu silinecek, süre sıfırlanacak.',()=>{const pr=progOf();pr.a=[];pr.acc=0;pr.run=false;pr.done=false;pr.res=null;V.hideKey=true;save();keyApply();sheetRender()},'Evet, yeniden çöz')}

const tot=k.sec.reduce((a,x)=>a+x.length,0),mark=pr.a.filter(Boolean).length,names=secNames(V.f,k),done=!!pr.done;let g=0;
const grid=k.sec.map((a,si)=>`<div class="mu" style="margin:14px 0 6px"><b>${esc(names[si])}</b> · ${a.length} soru</div>`+a.map((kl,qi)=>{const i=g++,cur=pr.a[i]||'';return `<div class="qrow" id="qr${i}"><span class="qn">${qi+1}</span>${'ABCDE'.split('').map(l=>`<button class="bub ${done?(l===kl?'ok':(cur===l?'bad':'')):(cur===l?'on':'')}" ${done?'disabled':''} onclick="sheetPick(${i},'${l}')">${l}</button>`).join('')}</div>`}).join('')).join('');

<div class="card hero" style="text-align:center;margin:6px 0"><div class="big" style="font-size:42px;margin:4px 0">${r.net}</div><div class="mu">toplam net · ${r.d} doğru · ${r.y} yanlış · ${r.b} boş</div><div class="mu">Süre: ${hm(r.t)} / ${pr.dur||exDur(V.f)} dk</div></div>
${r.u?`<p class="mu">${r.u} soru için cevap anahtarı yok, hesaba katılmadı.</p>`:''}
${r.secs.map((x,si)=>`<div class="card" style="margin:8px 0"><div class="row sp"><b>${esc(names[si])}</b><b>${x.net} net</b></div><div class="mu">${x.d} doğru · ${x.y} yanlış · ${x.b} boş</div>${x.wrong.length?`<div class="mu" style="margin-top:6px">Yanlış: ${x.wrong.join(', ')}</div>`:''}${x.blank.length?`<div class="mu">Boş: ${x.blank.join(', ')}</div>`:''}</div>`).join('')}
${exAddBtn()}<h2 style="margin-top:18px">Cevap kâğıdı</h2><p class="mu">Yeşil doğru şık, kırmızı senin yanlış işaretin.</p>${grid}`;return}
const rem=pRemain(pr),noKey=!k.sec.some(a=>a.some(Boolean));
d.innerHTML=`<div class="shh"><div><b>Cevap kâğıdı</b><div class="mu" id="shc">${mark} / ${tot} işaretlendi</div></div><div class="row" style="gap:4px"><button class="btn d" onclick="sheetClear()">Temizle</button><button class="btn d" onclick="sheetToggle()">Kapat</button></div></div>
<div class="card" style="margin:0 0 8px;padding:12px 14px"><div class="row sp"><div><div class="mu">Kalan süre</div><b id="pdft" style="font-size:24px;font-variant-numeric:tabular-nums">${fmtT(Math.max(0,rem))}</b></div><div class="row" style="gap:8px">${pr.run?`<button class="btn s" onclick="pPause()">Duraklat</button>`:`<button class="btn s" onclick="pStart()">${(pr.acc||0)>0?'Devam':'Başlat'}</button>`}</div></div>
${pr.run?'':`<div class="row" style="margin-top:8px;gap:8px"><span class="mu">Süre (dk)</span><input type="number" inputmode="numeric" style="max-width:90px;min-height:40px;padding:6px 10px" value="${pr.dur||exDur(V.f)}" onchange="pDur(this.value)"></div>`}</div>
${noKey?`<div class="card w mu" style="margin:0 0 8px">Cevap anahtarı yok, net hesaplanamaz. <button class="btn s g" onclick="sheetKeyEdit()">Anahtarı ekle</button></div>`:''}
${k.pages&&k.pages.length?`<label class="row" style="margin:0 0 6px;color:var(--tx);font-size:14px"><input type="checkbox" style="width:20px;min-height:0" ${V.hideKey?'checked':''} onchange="keyHide(this.checked)">Cevap anahtarı sayfalarını gizle</label>`:''}

function sheetSetup(){const n=+($$('shn').value||0),kt=$$('shk').value||'';let sec=parseKeyText(kt);

if(!sec.length&&n>0)sec=[Array(Math.min(n,300)).fill('')];if(!sec.length){toast('Soru sayısını yaz.');return}
const k={m:V.f.mtime,sec,pages:[],manual:true};S.exm.key[V.f.rel]=k;V.key=k;V.setup=false;save();keyApply();sheetRender()}
function sheetPick(i,l){const pr=progOf();if(pr.done)return;pr.a[i]=pr.a[i]===l?'':l;save();const r=$$('qr'+i);if(r)[...r.children].forEach((b,j)=>{if(j>0)b.classList.toggle('on','ABCDE'[j-1]===pr.a[i])});
const c=$$('shc'),tot=V.key.sec.reduce((a,x)=>a+x.length,0);if(c)c.textContent=pr.a.filter(Boolean).length+' / '+tot+' işaretlendi'}

return `<p class="mu">Ne kadar çalıştığını sayaçla tut; uygulamayı kapatsan da süre işlemeye devam eder.</p>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${mini(hm(st.td),'bugün')}${mini(hm(st.wk),'bu hafta')}${mini(hm(st.all),'toplam')}</div>
${rows.length?`<h2>Bu hafta derslere göre</h2><div class="card">${rows.map(([n,v],i)=>`<div style="${i?'margin-top:14px':''}"><div class="row sp"><span>${esc(n)}</span><span class="mu">${hm(v)}</span></div><div class="bar" style="height:8px"><i style="width:${Math.round(v/mx*100)}%"></i></div></div>`).join('')}</div>`:''}
${recent.length?`<h2>Son kayıtlar</h2><div class="card" style="padding:6px 18px">${recent.map((x,i)=>`<div class="row sp" style="padding:12px 0;${i?'border-top:1px solid var(--bd)':''}"><div><b>${esc(x.subj)}</b><div class="mu">${new Date(x.t).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})} · ${hm(x.sec)}</div></div><button class="btn d" aria-label="Sil" onclick="tDel('${x.id}')">${ic('trash',18)}</button></div>`).join('')}</div>`:'<div class="card mu">Henüz kayıt yok. Sayacı başlatıp bitirdiğinde burada görünür.</div>'}`}
addEventListener('visibilitychange',()=>{const e=$('#hdate');if(e&&document.visibilityState==='visible')e.textContent=dateStr();if((tab==='exam'||SAok===false)&&document.visibilityState==='visible')saRefresh()});
setInterval(()=>{const e=$('#hdate');if(e)e.textContent=dateStr();const c=$('#tclk');if(c)c.textContent=fmtT(tEl());pdfTimerTick()},1000);
const CHANGES=['Yeni açılış ekranı','Otomatik program: ders, saat ve ara süresine göre 5 farklı program seçeneği','Yeni Süre bölümü: çalışma sayacı ve soru hızı analizi','Ana sayfada tarih ve saat cihazdan okunuyor; Hedeflerim kartı açılıp kapanıyor','Koç artık uygulamayı tanıtıyor ve kullanım sorularını yanıtlıyor','Profil düzenlendi; geliştirilmiş geri bildirim formu ve Sık sorulan sorular eklendi','Verilerin korunur: bu güncelleme hiçbir kaydını silmez'];
function showNews(force){if(!S.user)return;if(!force&&S.seenVer===VER)return;S.seenVer=VER;save();modal(`<h1>Yeni sürüm ${VER}</h1><p class="mu" style="margin:6px 0 12px">Neler değişti?</p>${ul(CHANGES)}<button class="btn" style="width:100%;margin-top:18px" onclick="closeM();askStorage()">Başla</button>`);return true}
function afterSplash(){if(!showNews(false))askStorage()}
render();
(function(){const T=['Koç uyandırılıyor','Veriler analiz ediliyor','Çalışmaya başlanıyor'],el=document.getElementById('spt');let i=0;
function ty(){const s=T[i];let k=0;el.textContent='';const iv=setInterval(()=>{el.textContent=s.slice(0,++k);if(k>=s.length)clearInterval(iv)},Math.max(20,Math.min(45,700/s.length)))}
ty();const tm=setInterval(()=>{i++;if(i<3)ty();else clearInterval(tm)},1000);
setTimeout(()=>{const sp=document.getElementById('splash');if(!sp)return;sp.classList.add('out');setTimeout(()=>{sp.remove();afterSplash()},450)},3000)})();
</script></body></html>
